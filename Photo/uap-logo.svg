<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="130" height="130">
  <!-- Outer Gold Rings -->
  <circle cx="100" cy="100" r="96" fill="#002b49" stroke="#c5a059" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#c5a059" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="100" cy="100" r="70" fill="#033860" stroke="#c5a059" stroke-width="2"/>

  <!-- University Name Arc Path -->
  <defs>
    <path id="textArcTop" d="M 24 100 A 76 76 0 0 1 176 100" fill="none"/>
    <path id="textArcBottom" d="M 176 100 A 76 76 0 0 1 24 100" fill="none"/>
  </defs>

  <text font-family="'Times New Roman', serif" font-size="11.5" font-weight="bold" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      UNIVERSITY OF ASIA PACIFIC
    </textPath>
  </text>

  <text font-family="'Times New Roman', serif" font-size="9" font-weight="bold" fill="#c5a059" letter-spacing="1">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ★ COMMITTED TO EXCELLENCE ★
    </textPath>
  </text>

  <!-- Center Shield / Crest -->
  <path d="M 70 70 L 130 70 L 130 110 Q 100 142 70 110 Z" fill="#00233d" stroke="#c5a059" stroke-width="2"/>

  <!-- Open Book of Knowledge -->
  <path d="M 77 92 Q 88 86 100 90 Q 112 86 123 92 L 123 108 Q 112 102 100 106 Q 88 102 77 108 Z" fill="#ffffff" stroke="#00233d" stroke-width="1"/>
  <line x1="100" y1="90" x2="100" y2="106" stroke="#c5a059" stroke-width="1.5"/>

  <!-- Torch / Flame -->
  <path d="M 100 73 Q 105 80 100 86 Q 95 80 100 73 Z" fill="#f59e0b"/>
  <circle cx="100" cy="77" r="2.5" fill="#ef4444"/>

  <!-- Year Estd -->
  <text x="100" y="124" font-family="'Times New Roman', serif" font-size="7.5" font-weight="bold" fill="#c5a059" text-anchor="middle">
    ESTD. 1996
  </text>

  <!-- Dhaka Bangladesh -->
  <text x="100" y="132" font-family="Arial, sans-serif" font-size="5.5" font-weight="600" fill="#94a3b8" text-anchor="middle">
    DHAKA, BANGLADESH
  </text>
</svg>

